apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "claude-ui.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "claude-ui.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "claude-ui.fullname" . }}
    spec:
      containers:
        - name: claude-ui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3000
            - containerPort: 3100
          env:
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            - name: CLAUDE_UI_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "claude-ui.fullname" . }}
                  key: CLAUDE_UI_SECRET
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "claude-ui.fullname" . }}
                  key: LITELLM_API_KEY
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "claude-ui.fullname" . }}
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "claude-ui.fullname" . }}
                  key: GOOGLE_CLIENT_SECRET
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "claude-ui.fullname" . }}
                  key: NEXTAUTH_SECRET
            - name: CREDENTIALS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "claude-ui.fullname" . }}
                  key: CREDENTIALS_ENCRYPTION_KEY
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ include "claude-ui.fullname" . }}
                  key: ADMIN_EMAIL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: claude-credentials
              mountPath: /root/.claude/.credentials.json
              subPath: credentials.json
              readOnly: true
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "claude-ui.fullname" . }}-data
        - name: claude-credentials
          secret:
            secretName: {{ include "claude-ui.fullname" . }}
