apiVersion: v1
kind: Secret
metadata:
  name: {{ include "claude-ui.fullname" . }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  CLAUDE_UI_SECRET: {{ .Values.secrets.claudeUiSecret | quote }}
  LITELLM_API_KEY: {{ .Values.secrets.litellmApiKey | quote }}
  credentials.json: {{ .Values.secrets.claudeCredentials | quote }}
