apiVersion: v1
kind: Secret
metadata:
  name: {{ include "claude-ui.fullname" . }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  CLAUDE_UI_SECRET: {{ .Values.secrets.claudeUiSecret | quote }}
  LITELLM_API_KEY: {{ .Values.secrets.litellmApiKey | quote }}
  GOOGLE_CLIENT_ID: {{ .Values.secrets.googleClientId | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.googleClientSecret | quote }}
  NEXTAUTH_SECRET: {{ .Values.secrets.nextauthSecret | quote }}
  CREDENTIALS_ENCRYPTION_KEY: {{ .Values.secrets.credentialsEncryptionKey | quote }}
  ADMIN_EMAIL: {{ .Values.secrets.adminEmail | quote }}
  credentials.json: {{ .Values.secrets.claudeCredentials | quote }}
