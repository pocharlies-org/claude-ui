replicaCount: 1

image:
  repository: a8n-docker.repo.com.int.zone/devopsai/claude-ui
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  webPort: 3000
  mcpPort: 3100

ingress:
  enabled: true
  host: claude-ui.your-domain.com
  annotations:
    kubernetes.io/ingress.class: nginx

persistence:
  size: 5Gi
  storageClass: ""

env:
  LITELLM_URL: "http://litellm:4000"
  MCP_PORT: "3100"
  DATABASE_URL: "file:/data/db.sqlite"
  LOG_LEVEL: "info"
  NEXTAUTH_URL: "https://claude-ui.com.int.zone"

secrets:
  claudeUiSecret: ""                # CLAUDE_UI_SECRET
  claudeCredentials: ""              # ~/.claude/.credentials.json (Teams OAuth fallback for webhooks/MCP/cron)
  litellmApiKey: ""                  # LITELLM_API_KEY
  googleClientId: ""                 # GOOGLE_CLIENT_ID
  googleClientSecret: ""             # GOOGLE_CLIENT_SECRET
  nextauthSecret: ""                 # NEXTAUTH_SECRET
  credentialsEncryptionKey: ""       # CREDENTIALS_ENCRYPTION_KEY (64-char hex)
  adminEmail: ""                     # ADMIN_EMAIL (auto-promoted admin user)

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi
